<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">gollabara 시스템 구조도 — 다크</title>
<desc id="desc">gollabara는 UX 엔지니어가 Open Design, Claude Code, Codex, Claude Design의 산출물을 관찰하는 도구입니다. Claude Code 플러그인 hook은 현재 지원하며 Open Design MCP 결과 속 이미지도 포함합니다. Open Design 자체 실행의 직접 수집과 Codex, Claude Design 연동은 예정입니다. POST /api/events로 golla serve에 수집하고 SQLite 메시지와 로컬 이미지 파일로 저장합니다. WebSocket /ws로 데스크톱 웹과 폰에 전달하며 폰은 Tailscale tailnet 안에서만 접속합니다. PWA 설치와 사용자 개입은 예정입니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ADB5BF" stroke-width="1.5"/></marker></defs>
