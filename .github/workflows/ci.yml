name: ci

# Repo-wide CI.
#
# - check: on PRs, main pushes, and merge_group: bun install (frozen bun.lock) → lint (ESLint) → typecheck (vue-tsc)
#   → test (bun test) → build:web (vite) → hook bundle drift check.
#
# plugin/bin/hook.js is a build output but is committed (AGENTS.md). The plugin is copied into a cache and runs
# from this file alone, so PRs that change src/hook or src/shared without rebuilding are blocked here.
# No deploy job — no secrets or OIDC needed.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Required status check name — if you change it, update the branch protection rules too.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Match the local dev version (bun 1.3.13).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      # The prepare script (husky || true) runs too — install passes even if hook setup fails in CI.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build web
        run: bun run build:web

      # Check that the committed hook bundle matches a fresh build from source.
      - name: Hook bundle drift
        run: |
          bun run build:hook
          if ! git diff --exit-code plugin/bin/hook.js; then
            echo "::error file=plugin/bin/hook.js::The committed hook bundle is stale — run 'bun run build:hook' and commit plugin/bin/hook.js."
            exit 1
          fi
