name: ci

# 레포 전체 CI.
#
# - check: PR·main push·merge_group에서 bun install(bun.lock 고정) → lint(ESLint) → typecheck(vue-tsc)
#   → test(bun test) → build:web(vite) → hook 번들 drift 검사.
#
# plugin/bin/hook.js 는 빌드 산출물이지만 커밋한다(AGENTS.md). 플러그인은 캐시로 복사되어 이 파일만으로
# 돌아가므로, src/hook · src/shared 를 고치고 다시 빌드하지 않은 PR 은 여기서 막는다.
# 배포 잡은 없다 — 시크릿·OIDC 가 필요 없다.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # required status check 이름 — 바꾸면 브랜치 보호 규칙도 같이 바꿔야 한다.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 로컬 개발 버전(bun 1.3.13)과 맞춘다.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      # prepare 스크립트(husky || true)가 함께 돈다 — CI 에서 hook 설치가 실패해도 install 은 통과한다.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build web
        run: bun run build:web

      # 커밋된 hook 번들이 지금 소스로 다시 빌드한 결과와 같은지 본다.
      - name: Hook bundle drift
        run: |
          bun run build:hook
          if ! git diff --exit-code plugin/bin/hook.js; then
            echo "::error file=plugin/bin/hook.js::커밋된 plugin/bin/hook.js 가 소스와 다릅니다(stale). 'bun run build:hook' 으로 다시 빌드해 함께 커밋하세요. / The committed hook bundle is stale — run 'bun run build:hook' and commit plugin/bin/hook.js."
            exit 1
          fi
