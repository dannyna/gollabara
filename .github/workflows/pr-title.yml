name: pr-title

# Conventional Commit check for PR titles.
#
# - pr-title: main only takes squash merges, where the PR title becomes the commit message on main. Branch
#   commits are gated by husky commit-msg (commitlint), but nothing checks PR titles, so the same rules
#   (config-conventional types, optional scope, Korean subjects allowed) are checked here.
#
# The trigger is pull_request_target. This is a public repo, so fork PRs get no GITHUB_TOKEN under pull_request and
# the action cannot read the PR. This workflow never checks out or runs PR code and only reads the title, so it is
# safe to run with pull_request_target's base permissions. The catch: the config on main is used — a PR that changes
# this file takes effect from the next PR.
# The job is skipped on merge_group (skipped = pass) so the required check doesn't block the merge queue.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Required status check name — if you change it, update the branch protection rules too.
    name: pr-title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same as @commitlint/config-conventional's type-enum.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Accepts Korean subjects — no case rule, it just must not be empty (same as subject-case off in commitlint).
          subjectPattern: ^\S.*$
          subjectPatternError: |
            The PR title subject is empty or starts with whitespace: "{subject}"
            Example: "ci: add lint, test, and build CI with git hooks"
