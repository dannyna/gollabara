name: pr-title

# PR 제목 Conventional Commit 검사.
#
# - pr-title: main 은 squash merge 로만 받고, 그때 PR 제목이 main 의 커밋 메시지가 된다. 브랜치 커밋은
#   husky commit-msg(commitlint)가 막지만 PR 제목은 아무도 보지 않으므로 여기서 같은 규칙(config-conventional
#   타입, scope 선택, 한국어 subject 허용)으로 검사한다.
#
# 트리거는 pull_request_target 이다. 공개 레포라 fork PR 에서는 pull_request 의 GITHUB_TOKEN 이 없어 액션이
# PR 을 조회하지 못한다. 이 워크플로는 PR 코드를 checkout 하지도 실행하지도 않고 제목만 읽으므로
# pull_request_target 의 base 권한으로 돌려도 안전하다. 대신 설정은 main 에 있는 것이 쓰인다 — 이 파일을 바꾸는
# PR 에서는 바뀐 설정이 다음 PR 부터 적용된다.
# merge_group 에서는 잡을 건너뛴다(skipped = 통과). required check 가 merge queue 를 막지 않게 하려는 것이다.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # required status check 이름 — 바꾸면 브랜치 보호 규칙도 같이 바꿔야 한다.
    name: pr-title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # @commitlint/config-conventional 의 type-enum 과 같다.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # 한국어 subject 를 받는다 — 대소문자 규칙 없이 비어 있지만 않으면 된다(commitlint 의 subject-case 끔과 같다).
          subjectPattern: ^\S.*$
          subjectPatternError: |
            PR 제목의 subject 가 비어 있거나 공백으로 시작합니다: "{subject}"
            예: "ci: 린트 · 테스트 · 빌드 CI와 git hook 추가"
