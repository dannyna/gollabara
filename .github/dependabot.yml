version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies

  # The bun ecosystem updates bun.lock (text lockfile) too. The npm ecosystem leaves bun.lock unchanged.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 10
